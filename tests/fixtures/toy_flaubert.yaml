batch_size: 8
biaffine_dim: 64
deprels_hidden_dim: 32
dropout: 0.5
encoder:
  dropout: 0.5
  lexers:
  - layers: '*'
    model: lgrobol/flaubert-minuscule
    name: flaubert_minuscule
    subwords_reduction: mean
    type: bert
  rnn_dim: 32
epochs: 2
heads_hidden_dim: 128
lr:
  base: 3.0e-05
  shape: linear
  warmup_steps: 100
pos_hidden_dim: 16
version: 2
