batch_size: 8
biaffine_dim: 64
deprels_hidden_dim: 32
dropout: 0.1
encoder:
  dropout: 0.0
  lexers:
  - embedding_size: 16
    name: word_embeddings
    type: words
    word_dropout: 0.1
  - embedding_size: 4
    lstm_output_size: 8
    name: char_level_embeddings
    type: chars_rnn
  - name: fasttext
    source: fasttext_model.bin
    type: fasttext
  - layers: '*'
    model: lgrobol/roberta-minuscule
    name: roberta_minuscule
    subwords_reduction: mean
    type: bert
  rnn_dim: 32
epochs: 2
heads_hidden_dim: 128
lr:
  base: 3.0e-05
  shape: linear
  warmup_steps: 100
pos_hidden_dim: 16
version: 2
