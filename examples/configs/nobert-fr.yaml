batch_size: 32
biaffine_dim: 512
deprels_hidden_dim: 128
dropout: 0.5
encoder:
  dropout: 0.6
  lexers:
  - embedding_size: 128
    name: word_embeddings
    type: words
    word_dropout: 0.6
  - embedding_size: 64
    lstm_output_size: 128
    name: char_level_embeddings
    type: chars_rnn
  - name: fasttext
    source: facebook/fasttext-fr-vectors
    type: fasttext
  rnn_dim: 256
epochs: 128
heads_hidden_dim: 512
lr:
  base: 0.001
pos_hidden_dim: 16
version: 2
