batch_size: 8
biaffine_dim: 1024
deprels_hidden_dim: 128
dropout: 0.5
encoder:
  dropout: 0.5
  lexers:
  - layers: '*'
    model: microsoft/mdeberta-v3-base
    name: mdeberta_base
    subwords_reduction: mean
    type: bert
  rnn_dim: 512
epochs: 64
heads_hidden_dim: 512
lr:
  base: 3.0e-05
  shape: linear
  warmup_steps: 1000
pos_hidden_dim: 16
version: 2
