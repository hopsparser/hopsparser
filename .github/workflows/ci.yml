name: Continuous integration

on:
  push:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy_trigger:
        description: Force a deployment to PyPI
        default: "false"
        required: true
env:
  FORCE_COLOR: "1"

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: "**/pyproject.toml"
          cache-suffix: docs
          enable-cache: true
      - name: Build docs
        run: uv tool run nox --session docs

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact ⬆️
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build

  deploy-docs:
    if: >
      (github.event_name == 'push' && github.event.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_trigger ==
      'true')
    concurrency:
      group: "pages"
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    runs-on: ubuntu-latest
    needs: docs
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

  lint:
    strategy:
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          cache-suffix: lint-py${{ matrix.python-version }}-${{ matrix.os }}
          enable-cache: true
      - name: Lint
        run: uv tool run nox --session lint
  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 4
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          cache-suffix: test-py${{ matrix.python-version }}-${{ matrix.os }}
          enable-cache: true
      - name: Create base venv
        run: uv venv --python ${{ matrix.python-version }}
      - name: Get transformers and cache
        id: transfo-install
        run: |
          source .venv/bin/activate
          uv pip install --upgrade "transformers < 5"
          python -c "from transformers.file_utils import TRANSFORMERS_CACHE; print(f'dir={TRANSFORMERS_CACHE}')" >> $GITHUB_OUTPUT
          echo "version=$(pip show transformers | grep Version)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v5
        with:
          path: ${{ steps.transfo-install.outputs.dir }}
          key: ${{ runner.os }}-transformers-${{ steps.transfo-install.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-transformers-
      - name: Run tests
        run: uv tool run nox --session tests --python ${{ matrix.python-version }} -- --verbose
      - name: Upload hypothesis examples database
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: hypothesis-example-db-py${{ matrix.python-version }}-${{ matrix.os}}
          path: .hypothesis/examples
  build:
    name: Build wheels and sdist
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - "3.14"
    needs: test
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          cache-suffix: build-py${{ matrix.python-version }}-${{ matrix.os }}
          enable-cache: true
      - name: Build wheels and sdist
        run: uv build --python ${{ matrix.python-version }} --wheel --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheel
          path: ./dist/*.whl
  upload_pypi:
    needs: build
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'release' && github.event.action == 'published')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_trigger == 'true')
    environment:
      name: pypi
      url: https://pypi.org/p/hopsparser
    permissions:
      id-token: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
